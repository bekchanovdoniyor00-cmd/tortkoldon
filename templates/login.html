{% extends 'base.html' %}{% block content %}<div style="text-align:center"><img src="{{ url_for('static', filename='logo.png') }}" alt="{{ t('nav.logo_alt') }}" style="max-width:130px"></div><section class="auth"><h1>{{ t('login.title') }}</h1><p>{{ t('login.subtitle') }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t('login.username') }}<input name="username" required autocomplete="username"></label><label>{{ t('login.password') }}<input name="password" type="password" required autocomplete="current-password"></label><button>{{ t('login.submit') }}</button></form><p class="hint">{{ t('login.hint') }}</p></section>{% endblock %}
