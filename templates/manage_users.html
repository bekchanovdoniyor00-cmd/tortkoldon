{% extends "base.html" %}{% block content %}<h2>Foydalanuvchilar</h2><p>Yangi foydalanuvchi: <a href="{{url_for('setup')}}">Qo‘shish</a></p>{% for u in users %}<section style="padding:12px;border-bottom:1px solid #ddd"><b>{{u.username}}</b> — {{roles.get(u.role,u.role)}} — {{'Faol' if u.active else 'Bloklangan'}}<br>Telefon: {{u.phone}}<form method="post" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="user_id" value="{{u.id}}"><input type="hidden" name="action" value="reset"><input type="password" name="new_password" minlength="10" placeholder="Yangi parol" required><button>Parolni tiklash</button></form><form method="post" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="user_id" value="{{u.id}}"><input type="hidden" name="action" value="set_active"><input type="hidden" name="target_active" value="{{ 1-u.active }}"><input type="hidden" name="operation_token" value="{{ write_operation_token('user_status', target_id=u.id, expected_active=u.active, version=u.status_version, desired_active=1-u.active) }}"><button>{{'Bloklash' if u.active else 'Faollashtirish'}}</button></form></section>{% endfor %}{% endblock %}
