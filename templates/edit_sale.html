{% extends 'base.html' %}{% block content %}<h1>Sotuvni tahrirlash</h1><section class="panel"><p class="muted">Eski sotuv yozuvlari o‘zgarmaydi. Yangi mahsulot turlari uchun qop yoki rassipnoy tanlang.</p><form method="post" class="form-grid"><input type="hidden" name="edit_version_token" value="{{ edit_version_token }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Sana<input type="date" name="date" value="{{ sale.date|business_date_input }}" required></label><label>Xaridor<input name="customer" value="{{ sale.customer }}" required></label><label>Telefon *<input name="customer_phone" type="tel" value="{{ sale.customer_phone or '' }}" required></label>
<label>Mahsulot<select name="product" id="product">{% for p in products %}<option value="{{ p }}" {% if sale.product==p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label>
<label>Sotuv usuli<select name="sale_mode" id="mode"><option value="qop">Qopda</option><option value="kg">Rassipnoy</option></select></label><label id="bag-label">Qop hajmi<select name="bag_kg" id="bag"></select></label><label id="count-label">Qop soni<input type="number" name="bag_count" id="count" step="1" min="1" value="{{ sale.bag_count or 1 }}"></label><label id="kg-label">Miqdor kg<input type="number" name="qty_kg" id="qty" step="0.01" min="0.01" value="{{ sale.qty_kg }}"></label>
<label>Narx (qop yoki kg)<input type="number" name="price" step="0.01" min="0" value="{{ sale.unit_price if sale.unit_price is not none else sale.price_per_kg }}" required></label><label>To‘langan<input type="number" name="paid" min="0" step="0.01" value="{{ sale.paid }}"></label><label>Izoh<input name="note" value="{{ sale.note or '' }}"></label><button>Saqlash</button><a href="{{ url_for('sales_page') }}">Bekor qilish</a></form></section>
<style>[hidden]{display:none!important}</style>
<script>const opts={{bag_options|tojson}},loose={{loose_products|tojson}};let p=document.getElementById('product'),m=document.getElementById('mode'),b=document.getElementById('bag'),c=document.getElementById('count'),q=document.getElementById('qty');function refresh(){let old=b.value;b.replaceChildren();(opts[p.value]||[]).forEach(x=>b.add(new Option(x+' kg',x)));if([...b.options].some(o=>o.value===old))b.value=old;let isKg=m.value==='kg';document.getElementById('bag-label').hidden=isKg;document.getElementById('count-label').hidden=isKg;document.getElementById('kg-label').hidden=!isKg;b.disabled=isKg;c.disabled=isKg;q.disabled=!isKg;}p.onchange=()=>{if(!loose.includes(p.value))m.value='qop';refresh()};m.onchange=refresh;m.value={{sale.sale_mode|tojson}};refresh();{% if sale.bag_kg %}b.value={{sale.bag_kg|tojson}};{% endif %}</script>{% endblock %}
