<!doctype html><html lang="{{ ui_language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t('employee.sale_result_title') }}</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf6f2;font-family:system-ui,sans-serif;color:#174c3c}.panel{background:white;border:1px solid #dbe9e2;border-radius:20px;max-width:460px;width:calc(100% - 40px);box-shadow:0 18px 45px #073c2919;text-align:center;padding:34px 22px}h1{font-size:25px;color:#0c7659}p{line-height:1.6}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}.button{border-radius:10px;padding:13px 34px;text-decoration:none;font-weight:700;background:#087856;color:white}.button.no{background:#e6f0eb;color:#154d3a}</style></head><body><main class="panel"><h1>✓ {{ t('employee.sale_saved') }}</h1><p>{{ t('employee.invoice_number') }}{{ invoice.number }}<br>{{ t('employee.sale_written_once') }}</p><h2>{{ t('employee.print_invoice_question') }}</h2><div class="actions"><a class="button" href="{{ url_for('worker_batch_invoice',invoice_id=invoice.id) }}">{{ t('employee.yes') }}</a><a class="button no" href="{{ url_for('worker_sales') }}">{{ t('employee.no') }}</a></div><p style="color:#607e72;font-size:13px">{{ t('employee.yes_explanation') }} {{ t('employee.no_explanation') }}</p></main></body></html>
